<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A9BFF"/>
      <stop offset="100%" stop-color="#3A57E8"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="40" height="40" rx="11"/>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <!-- Background -->
    <rect width="40" height="40" fill="url(#bg)"/>
    <!-- Top highlight for depth -->
    <rect width="40" height="20" fill="white" fill-opacity="0.08"/>

    <!-- M letterform -->
    <path d="M8 10 L12 10 L20 21 L28 10 L32 10 L32 30 L28 30 L28 17 L20 25 L12 17 L12 30 L8 30 Z" fill="white" fill-opacity="0.95"/>

    <!-- Top serifs (left stem) -->
    <rect x="6" y="8" width="8" height="2.5" rx="1.25" fill="white" fill-opacity="0.95"/>
    <!-- Top serifs (right stem) -->
    <rect x="26" y="8" width="8" height="2.5" rx="1.25" fill="white" fill-opacity="0.95"/>

    <!-- Bottom serifs (left stem) -->
    <rect x="6" y="29" width="8" height="2.5" rx="1.25" fill="white" fill-opacity="0.95"/>
    <!-- Bottom serifs (right stem) -->
    <rect x="26" y="29" width="8" height="2.5" rx="1.25" fill="white" fill-opacity="0.95"/>
  </g>
</svg>
